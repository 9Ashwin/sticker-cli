name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o sticker${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/sticker
        env:
          CGO_ENABLED: '0'
      - name: Smoke test
        shell: bash
        run: ./sticker${{ runner.os == 'Windows' && '.exe' || '' }} version
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - run: make quality
